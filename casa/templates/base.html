<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Início{% endblock %} · Casa</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <!-- Ícone no separador e no ecrã principal do telemóvel ("Adicionar ao ecrã principal"). -->
  <link rel="icon" href="{{ url_for('static', filename='icone.svg') }}" type="image/svg+xml">
  <meta name="theme-color" content="#14302b">
  <meta name="apple-mobile-web-app-title" content="Casa">
</head>
<body>
  <header class="topo">
    <a class="marca" href="{{ url_for('inicio') }}">🏠 Casa</a>
    {% if session.get('passe') %}
      <nav>
        <a href="{{ url_for('gastos.lista') }}" class="{{ 'ativo' if request.blueprint == 'gastos' }}">Gastos</a>
        <a href="{{ url_for('impressao.painel') }}" class="{{ 'ativo' if request.blueprint == 'impressao' }}">Impressão 3D</a>
        <a href="{{ url_for('receitas.orcamentos') }}" class="{{ 'ativo' if request.blueprint == 'receitas' }}">DeliciArt</a>
      </nav>
      <div class="conta">
        <a href="{{ url_for('configuracoes.pagina') }}" class="{{ 'ativo' if request.blueprint == 'configuracoes' }}" title="Configurações">⚙ Configurações</a>
        <form method="post" action="{{ url_for('auth.sair') }}">
          <button class="secundario pequeno">Sair</button>
        </form>
      </div>
    {% endif %}
  </header>
  <main>
    {% for categoria, mensagem in get_flashed_messages(with_categories=true) %}
      <div class="aviso {{ categoria }}">{{ mensagem }}</div>
    {% endfor %}
    {% block conteudo %}{% endblock %}
  </main>
  <script>
    const fmtEur = v => v.toLocaleString('pt-PT', { style: 'currency', currency: 'EUR' });
    // Igual a parse_num() em util.py: "1,5", "1.234,50" e "2.5".
    const lerNum = t => {
      let s = String(t || '').replace(/[€\s]/g, '');
      if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
      const n = parseFloat(s);
      return Number.isFinite(n) ? n : 0;
    };

    // Confirmação dentro da página (as janelas confirm() do browser podem estar bloqueadas).
    // O 1.º clique pede confirmação no próprio botão; o 2.º, nos 4 segundos seguintes, confirma.
    function pedirConfirmacao(botao, mensagem, acao) {
      if (botao._repor) {
        clearTimeout(botao._repor.timer);
        botao._repor();
        return acao();
      }
      const original = botao.innerHTML;
      const repor = () => {
        botao._repor = null;
        botao.innerHTML = original;
        botao.classList.remove('armado');
      };
      botao.textContent = 'Confirmar?';
      botao.classList.add('armado');
      if (mensagem) botao.title = mensagem;
      botao._repor = repor;
      repor.timer = setTimeout(repor, 4000);
    }

    document.addEventListener('submit', e => {
      const form = e.target;
      if (!form.dataset.confirmar) return;
      e.preventDefault();
      const botao = e.submitter || form.querySelector('button');
      pedirConfirmacao(botao, form.dataset.confirmar, () => form.submit());
    });

    // Um duplo clique em "Adicionar"/"Guardar" não deve gravar o mesmo registo duas vezes.
    document.addEventListener('submit', e => {
      const botao = e.submitter;
      if (e.defaultPrevented || !botao) return;
      setTimeout(() => { botao.disabled = true; botao.dataset.enviado = '1'; });
    });
    // Seletor de mês (macro escolher_mes): painel com o ano e os 12 meses; escolher um muda a página.
    const MESES = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
    for (const seletor of document.querySelectorAll('.seletor-mes')) {
      const botao = seletor.querySelector('.seletor-mes-botao');
      const painel = seletor.querySelector('.seletor-mes-painel');
      const grelha = seletor.querySelector('.seletor-mes-grelha');
      const { atual, minimo } = seletor.dataset;
      let ano = Number(atual.slice(0, 4));

      function desenhar() {
        seletor.querySelector('.seletor-mes-ano strong').textContent = ano;
        seletor.querySelector('[data-ano="-1"]').disabled = !!minimo && ano <= Number(minimo.slice(0, 4));
        grelha.replaceChildren(...MESES.map((nome, i) => {
          const mes = `${ano}-${String(i + 1).padStart(2, '0')}`;
          const b = document.createElement('button');
          b.type = 'button';
          b.textContent = nome;
          b.className = mes === atual ? '' : 'secundario';
          b.disabled = !!minimo && mes < minimo;
          b.addEventListener('click', () => {
            const url = new URL(location.href);
            url.searchParams.set('mes', mes);
            location.href = url;
          });
          return b;
        }));
      }

      function abrir(aberto) {
        painel.hidden = !aberto;
        botao.setAttribute('aria-expanded', aberto);
        if (aberto) { ano = Number(atual.slice(0, 4)); desenhar(); grelha.querySelector('button:not(.secundario)')?.focus(); }
      }

      botao.addEventListener('click', () => abrir(painel.hidden));
      for (const b of seletor.querySelectorAll('[data-ano]')) {
        b.addEventListener('click', () => { ano += Number(b.dataset.ano); desenhar(); });
      }
      document.addEventListener('click', e => { if (!seletor.contains(e.target)) abrir(false); });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && !painel.hidden) { abrir(false); botao.focus(); }
      });
    }

    // Nos campos de data, clicar em qualquer ponto abre o calendário (e não só no ícone).
    document.addEventListener('click', e => {
      const campo = e.target.closest('input[type=date]');
      if (campo && campo.showPicker) { try { campo.showPicker(); } catch {} }
    });

    // Barra do preço no telemóvel: esconde-se quando o quadro do preço já está à vista.
    const barraPreco = document.querySelector('.barra-preco');
    const resultado = document.getElementById('resultado');
    if (barraPreco && resultado && 'IntersectionObserver' in window) {
      new IntersectionObserver(([e]) => { barraPreco.style.visibility = e.isIntersecting ? 'hidden' : ''; })
        .observe(resultado);
    }

    // Ao voltar atrás no browser a página pode vir da cache com o botão ainda desativado.
    window.addEventListener('pageshow', () => {
      for (const b of document.querySelectorAll('[data-enviado]')) { b.disabled = false; delete b.dataset.enviado; }
    });

    // Listas reordenáveis (ver ordem.py): arrastar a pega ⠿ (rato ou dedo) ou usar as setas com ela selecionada.
    for (const corpo of document.querySelectorAll('tbody[data-ordem]')) {
      const linhas = () => [...corpo.querySelectorAll(':scope > tr[data-id]')];
      const ordemAtual = () => linhas().map(r => r.dataset.id).join();
      async function gravar(antes) {
        if (ordemAtual() === antes) return;
        const resp = await fetch(corpo.dataset.ordem, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(linhas().map(r => r.dataset.id)),
        });
        const barra = document.querySelector(`[data-barra-ordem="${corpo.dataset.tabela}"]`);
        if (!resp.ok || !barra) return;
        barra.querySelector('[data-texto-ordem]').textContent = 'Pela tua ordem · arrasta ⠿ para mudar';
        barra.querySelector('form').hidden = false;
      }

      corpo.addEventListener('pointerdown', e => {
        const pega = e.target.closest('.pega-botao');
        if (!pega || e.button > 0) return;
        e.preventDefault();
        const linha = pega.closest('tr');
        const antes = ordemAtual();
        linha.classList.add('a-arrastar');
        // Ouve-se na janela inteira: mudar a linha de sítio na página faria perder a captura do ponteiro na pega.
        const mover = ev => {
          if (ev.pointerId !== e.pointerId) return;
          const depois = linhas().find(r => {
            if (r === linha) return false;
            const caixa = r.getBoundingClientRect();
            return ev.clientY < caixa.top + caixa.height / 2;
          });
          corpo.insertBefore(linha, depois || null);
          // Perto das margens do ecrã a página desliza, para listas maiores que o ecrã.
          if (ev.clientY < 60) scrollBy(0, -12);
          else if (ev.clientY > innerHeight - 60) scrollBy(0, 12);
        };
        const largar = ev => {
          if (ev.pointerId !== e.pointerId) return;
          removeEventListener('pointermove', mover);
          removeEventListener('pointerup', largar);
          removeEventListener('pointercancel', largar);
          linha.classList.remove('a-arrastar');
          gravar(antes);
        };
        addEventListener('pointermove', mover);
        addEventListener('pointerup', largar);
        addEventListener('pointercancel', largar);
      });

      corpo.addEventListener('keydown', e => {
        const pega = e.target.closest('.pega-botao');
        if (!pega || !['ArrowUp', 'ArrowDown'].includes(e.key)) return;
        e.preventDefault();
        const linha = pega.closest('tr');
        const antes = ordemAtual();
        const todas = linhas();
        const vizinha = todas[todas.indexOf(linha) + (e.key === 'ArrowUp' ? -1 : 1)];
        if (!vizinha) return;
        corpo.insertBefore(linha, e.key === 'ArrowUp' ? vizinha : vizinha.nextSibling);
        pega.focus();
        gravar(antes);
      });
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
